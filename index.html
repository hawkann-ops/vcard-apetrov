<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Ададуров Александр Анатольевич — Визитка</title>
<style>
  :root {
    color-scheme: light dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(180deg, #f4f6f9 0%, #e9edf3 100%);
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: #ffffff;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(20, 30, 60, 0.12);
    padding: 32px 28px;
    text-align: center;
  }
  .avatar {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    background: linear-gradient(135deg, #2b5cff, #6b8cff);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    font-weight: 600;
    margin: 0 auto 18px;
  }
  h1 {
    font-size: 21px;
    margin: 0 0 4px;
    color: #14171f;
  }
  .role {
    font-size: 14px;
    color: #6b7280;
    margin: 0 0 2px;
  }
  .org {
    font-size: 14px;
    color: #6b7280;
    margin: 0 0 20px;
  }
  .details {
    text-align: left;
    background: #f7f8fa;
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 22px;
    font-size: 14px;
    color: #374151;
    line-height: 1.9;
  }
  .details a {
    color: #2b5cff;
    text-decoration: none;
  }
  .btn {
    display: block;
    width: 100%;
    padding: 15px 18px;
    background: #2b5cff;
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
    transition: transform .1s ease, background .15s ease;
  }
  .btn:active {
    transform: scale(0.98);
    background: #234ad9;
  }
  .hint {
    margin-top: 14px;
    font-size: 12px;
    color: #9aa1ac;
  }
  @media (prefers-color-scheme: dark) {
    body { background: linear-gradient(180deg, #0f1115 0%, #14171d 100%); }
    .card { background: #1a1d24; box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
    h1 { color: #f2f3f5; }
    .details { background: #22252d; color: #d1d5db; }
    .role, .org, .hint { color: #9aa1ac; }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="avatar">АА</div>
    <h1>Ададуров Александр Анатольевич</h1>
    <p class="role">Заместитель председателя правления по инвестициям и управлению активами в недвижимости</p>
    <p class="org">Фонд «Сколково»</p>

    <div class="details">
      📞 <a href="tel:+74959560033,5112">+7 495 956 00 33 (доб. 5112)</a><br>
      ✉️ <a href="mailto:AAdadurov@sk.ru">AAdadurov@sk.ru</a>
    </div>

    <a class="btn" href="contact.vcf">Добавить в контакты</a>
    <p class="hint">Нажмите, чтобы сохранить контакт в телефон</p>
  </div>
</body>
</html>
